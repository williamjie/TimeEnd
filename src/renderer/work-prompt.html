<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>休息结束</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: #2c3e50;
            color: #fff;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .box { text-align: center; }
        h1 { font-size: 1.4em; margin-bottom: 10px; }
        p { font-size: 1em; line-height: 1.5; margin-bottom: 16px; }
        button {
            padding: 8px 20px;
            font-size: 1em;
            border: none;
            border-radius: 8px;
            background: #f1c40f;
            color: #2c3e50;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>休息结束</h1>
        <p>该开始工作了，下一轮专注已自动开始。</p>
        <button id="ack-btn" type="button">知道了</button>
    </div>
    <script>
        const { ipcRenderer } = require('electron');
        document.getElementById('ack-btn').addEventListener('click', () => {
            ipcRenderer.send('close-work-prompt');
        });
    </script>
</body>
</html>
